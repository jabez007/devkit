# Merge into the operator policy OUTSIDE the project, mode 0600.
# Replace the path with the canonical project path. Include only needed surfaces.
[trusted_plugins]
devkit-beads = "0.3.0"
devkit-go = "0.1.0"

# List each linked checkout explicitly. Main-checkout grants do not cover siblings.
# Beads 0.3.0 qualifies sequential operation only; no concurrent-writer guarantee.
[profiles.beads]
projects = ["/absolute/path/to/project"]

[profiles.beads.commands."beads.workspace"]
effects = ["read_fs", "write_fs", "execute_process", "network_read"]
surfaces = ["cli", "python", "mcp"]

[profiles.beads.commands."beads.item.show"]
effects = ["read_fs", "write_fs", "execute_process", "network_read"]
surfaces = ["cli", "python", "mcp"]

[profiles.beads.commands."beads.ready"]
effects = ["read_fs", "write_fs", "execute_process", "network_read"]
surfaces = ["cli", "python", "mcp"]

[profiles.beads.commands."beads.dependencies"]
effects = ["read_fs", "write_fs", "execute_process", "network_read"]
surfaces = ["cli", "python", "mcp"]

[profiles.beads.commands."beads.evidence.associate"]
effects = ["read_fs", "write_fs", "execute_process", "network_read"]
surfaces = ["cli", "python", "mcp"]

[profiles.beads.commands."go.test"]
effects = ["read_fs", "write_fs", "execute_process", "network_read", "network_write"]
surfaces = ["cli", "python", "mcp"]

# Normal lifecycle access. Omit these five grants for restricted inspection and
# local evidence association. Close remains separately authorized from update.

[profiles.beads.commands."beads.item.create"]
effects = ["read_fs", "write_fs", "execute_process", "network_read", "network_write"]
surfaces = ["cli", "python", "mcp"]

[profiles.beads.commands."beads.item.claim"]
effects = ["read_fs", "write_fs", "execute_process", "network_read", "network_write"]
surfaces = ["cli", "python", "mcp"]

[profiles.beads.commands."beads.item.update"]
effects = ["read_fs", "write_fs", "execute_process", "network_read", "network_write"]
surfaces = ["cli", "python", "mcp"]

[profiles.beads.commands."beads.item.comment"]
effects = ["read_fs", "write_fs", "execute_process", "network_read", "network_write"]
surfaces = ["cli", "python", "mcp"]

[profiles.beads.commands."beads.item.close"]
effects = ["read_fs", "write_fs", "execute_process", "network_read", "network_write"]
surfaces = ["cli", "python", "mcp"]
