[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mccann-hub-devkit-example"
version = "0.2.0"
description = "Example bounded README whitespace verification for Devkit"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mccann-hub-devkit>=0.2,<0.3"]

[project.entry-points."mccann_hub.devkit.specializations.v1"]
example = "mccann_hub.devkit_example:register"

[tool.hatch.build.targets.wheel]
packages = ["src/mccann_hub"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "src", "tests", "examples", "README.md", "pyproject.toml"]
