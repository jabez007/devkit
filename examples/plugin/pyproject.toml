[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devkit-example"
version = "0.2.0"
description = "Example bounded README whitespace verification for Devkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["devkit>=0.1.2,<0.2"]

[project.entry-points."devkit.specializations.v1"]
example = "devkit_example:register"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_example"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "pyproject.toml"]
