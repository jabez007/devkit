schema_version = 1
plugins = ["go", "odoo"]
timeout = 90

[options.odoo]
target_version = "19.0"
addons_paths = ["addons"]
strict_dependencies = false
# "fresh" fails references to IDs that a later data file defines; use "update"
# when validating an upgrade of an already installed module.
install_mode = "fresh"
# Declared XML/CSV files and dependency cycles among inspected manifests are checked.

# A successful scan does not imply a complete inventory. Unknown dependencies
# remain unverified; strict_dependencies=true blocks when certainty is needed.
[options.odoo.inventory]
complete = false
complete_prefixes = []

[profiles]
verify = ["go.tests", "odoo.manifests"]
static = ["odoo.manifests"]
