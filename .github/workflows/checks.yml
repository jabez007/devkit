name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.24.4"
          cache: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.5"
      - run: uv python install 3.12
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - name: Install pinned Beads CLI for disposable acceptance workspaces
        run: |
          mkdir -p "$RUNNER_TEMP/devkit-beads"
          curl --fail --silent --show-error --location \
            https://github.com/gastownhall/beads/releases/download/v1.3.2/beads_1.3.2_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/devkit-beads/archive.tar.gz"
          cd "$RUNNER_TEMP/devkit-beads"
          echo 'c6ea3281f6ff82628351b2d0967c9eb85862c8a0ec0ebc24e63e645c8b02462e  archive.tar.gz' | sha256sum --check
          tar -xzf archive.tar.gz bd
      - run: uv run python scripts/check_wheels.py
        env:
          DEVKIT_BEADS_BINARY: ${{ runner.temp }}/devkit-beads/bd
