[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devkit"
version = "0.1.1"
description = "Composable developer commands and verification evidence"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.25,<5"]

[project.scripts]
devkit = "devkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit"]
