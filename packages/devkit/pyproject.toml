[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mccann-hub-devkit"
version = "0.2.0"
description = "Composable developer commands and verification evidence"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.25,<5"]

[project.scripts]
devkit = "mccann_hub.devkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mccann_hub"]

[project.urls]
Source = "https://github.com/jabez007/devkit"
Documentation = "https://github.com/jabez007/devkit/blob/main/docs/Getting_Started.md"
