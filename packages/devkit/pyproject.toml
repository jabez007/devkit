[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devkit"
version = "0.1.3"
description = "Composable developer commands and verification evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.25,<5"]

[project.scripts]
devkit = "devkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit"]

[project.urls]
Source = "https://github.com/jabez007/devkit"
Documentation = "https://github.com/jabez007/devkit/blob/main/docs/Getting_Started.md"
