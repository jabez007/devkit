[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devkit-go"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["devkit>=0.1,<0.2"]

[project.entry-points."devkit.specializations.v1"]
go = "devkit_go:register"

[tool.uv.sources]
devkit = {workspace = true}
