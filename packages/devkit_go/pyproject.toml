[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mccann-hub-devkit-go"
version = "0.1.0"
description = "Go test verification with structured results and evidence. Requires Go only when executing Go checks."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mccann-hub-devkit>=0.2,<0.3"]

[project.entry-points."mccann_hub.devkit.specializations.v1"]
go = "mccann_hub.devkit_go:register"

[tool.uv.sources]
mccann-hub-devkit = {workspace = true}

[project.urls]
Source = "https://github.com/jabez007/devkit"
Documentation = "https://github.com/jabez007/devkit/blob/main/docs/Getting_Started.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mccann_hub"]
