[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devkit-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["devkit>=0.1,<0.2", "mcp>=1.30,<2", "anyio>=4.5,<5"]

[project.scripts]
devkit-mcp = "devkit_mcp:main"

[tool.uv.sources]
devkit = {workspace = true}
