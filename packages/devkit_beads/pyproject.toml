[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devkit-beads"
version = "0.3.0"
description = "Optional Beads task lifecycle and Devkit evidence associations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["devkit>=0.1.2,<0.2"]

[project.entry-points."devkit.specializations.v1"]
beads = "devkit_beads:register"

[tool.uv.sources]
devkit = {workspace = true}

[project.urls]
Source = "https://github.com/jabez007/devkit"
Documentation = "https://github.com/jabez007/devkit/blob/main/docs/Getting_Started.md"
