[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devkit-beads"
version = "0.1.0"
description = "Optional read-only Beads work items and Devkit evidence associations"
requires-python = ">=3.12"
dependencies = ["devkit>=0.1.2,<0.2"]

[project.entry-points."devkit.specializations.v1"]
beads = "devkit_beads:register"

[tool.uv.sources]
devkit = {workspace = true}
