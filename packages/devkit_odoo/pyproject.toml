[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devkit-odoo"
version = "0.5.0"
description = "Offline Odoo addon verification. Does not require an Odoo server, Go or Beads."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["devkit>=0.1,<0.2"]

[project.entry-points."devkit.specializations.v1"]
odoo = "devkit_odoo:register"

[tool.uv.sources]
devkit = {workspace = true}

[project.urls]
Source = "https://github.com/jabez007/devkit"
Documentation = "https://github.com/jabez007/devkit/blob/main/docs/Getting_Started.md"
